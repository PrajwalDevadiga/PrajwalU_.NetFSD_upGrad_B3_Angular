<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Traffic Signal</h1>
        <script>
            let signal = "blue";

            switch(signal) {
                case "red":
                    console.log("Stop");
                    break;

                case "yellow":
                    console.log("Get Ready")
                    break;
                
                case "green":
                    console.log("Go");
                    break;

                default:
                    console.log("Invalid Traffic Signal Color");
            }
        </script>
    </body>
</html>
