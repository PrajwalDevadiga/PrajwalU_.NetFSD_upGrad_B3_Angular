<!DOCTYPE html>
<html>
<head>
    <title>Weather Data Fetcher</title>
</head>
<body>
    <style>
        body {
            background-color:lightcyan;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .promise {
            background-color: blue;
            padding: 10px;
            border-radius: 8px;
            border-width: 0px;
            color: white;
            margin: 5px;
        }

        .container {
            display: flex;
            
            padding: 10px;
        }

        .async {
            background-color: orange;
            padding: 10px;
            border-radius: 8px;
            border-width: 0px;
            color: white;
            margin: 5px;
        }
    </style>

    <h1>Weather Data Fetcher</h1>
    <div class="container">
        <button class="promise" onclick="promiseWeather()">Promise Weather</button>
        <button class="async" onclick="asyncWeather()">Async Weather</button>
    </div>
    
        <h3>Weather Promise Report:</h3>
        <p id="weather"></p>
        <h3>Weather Async Report:</h3>
        <p id="weather1"></p>

    <script>
        var weatherEl = document.getElementById("weather");
        var weather1El = document.getElementById("weather1");

        //Promise 

        const promiseWeather = () => {
            fetch("https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current_weather=true")
            .then((response) => {
                console.log(response)
                return response.json()
            })
            .then((jsonData) => {
                console.log(jsonData)
                let weatherData = jsonData.current_weather;
                    
                weatherEl.innerHTML = ` Temparature: ${weatherData.temperature} <br/>
                Wind Speed: ${weatherData.windspeed} km/h <br/> 
                Wind Direction: ${weatherData.winddirection}`;
                
            })
            .catch((error) => {
                weatherEl.innerHTML = `Error: ${error}`;
            });
        }

        //Async Await 

        const asyncWeather = async () => {
            let url = "https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current_weather=true";
            let response = await fetch(url);
            let jsonData = await response.json();
            let weatherData = jsonData.current_weather;
            weather1El.innerHTML = ` Temparature: ${weatherData.temperature} <br/>
                Wind Speed: ${weatherData.windspeed} km/h <br/> 
                Wind Direction: ${weatherData.winddirection}`;
        }
        
    </script>
 
</body>
</html>
