<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Card</title>

    <style>
        
        body {
            background-color: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        
        .card {
            background-color: white;
            width: 320px;

            
            padding: 25px;
            margin: 20px;
            border: 2px solid #ddd;
            border-radius: 12px;

            text-align: center;
        }

        
        .name {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        
        .role {
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
            text-decoration: underline;
        }

        
        .bio {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        
        .btn:hover {
            background-color: #0056b3;
        }

    </style>
</head>

<body>

    <div class="card">
        <h2 class="name">Prajwal Devadiga</h2>
        <p class="role">Frontend Developer</p>
        <p class="bio">
            Passionate about building responsive and user-friendly web applications.
            Skilled in HTML, CSS, JavaScript, and React.
        </p>
        <button class="btn">Contact Me</button>
    </div>

</body>
</html>
