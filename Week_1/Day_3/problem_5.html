<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
        }

       
        .sidebar {
            width: 220px;
            background-color: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            margin: 15px 0;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
        }

        
        .main {
            flex: 1;
            background-color: #f1f5f9;
            padding: 20px;
        }

        .main h1 {
            margin-bottom: 20px;
        }

        
        .cards {
            display: flex;
            gap: 20px;
        }

        
        .card {
            flex: 1;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

       
        @media (max-width: 768px) {

            body {
                flex-direction: column;
            }

            
            .sidebar {
                width: 100%;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            .sidebar ul {
                display: flex;
                gap: 20px;
            }

            .sidebar li {
                margin: 0;
            }

           
            .cards {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    
    <div class="main">
        <h1>Dashboard Overview</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$8,430</p>
            </div>

            <div class="card">
                <h3>New Orders</h3>
                <p>320</p>
            </div>
        </div>
    </div>

</body>
</html>
