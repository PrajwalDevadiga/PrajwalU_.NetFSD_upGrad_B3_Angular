<!DOCTYPE html>
<html>
<head>
    <title>Our Product Features</title>
    
</head>
<body>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .features {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
        }


        .features h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .features-list {
            list-style-type: none;
        }

        .features-list li {
            text-align: center;
            background-color: lightblue;
            color: #2c3e50;
            width: 400px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #3498db;
            border-radius: 6px;
            font-weight: 500;
        }


        .features-list li:hover {
            background-color: #3498db;
            color: white;
        }
    </style>

    <section class="features">
        <h1>Why u should choose our Product?</h1>

        <ul class="features-list">
            <li>User Friendly Interface</li>
            <li>Reasonable Pricing</li>
            <li>Good Performance</li>
            <li>Secure Data Protection</li>
        </ul>
    </section>

</body>
</html>
