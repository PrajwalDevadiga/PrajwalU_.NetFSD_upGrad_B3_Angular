<!DOCTYPE html>
<html>
<head>
    <title>Product List with Add to Cart Counter</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"  rel="stylesheet"  />
</head>
<body>
    <style>
        *{
            margin: 10px;
        }

        .container {
            border: 1px solid black;
            border-radius: 8px;
            margin: 5px;
            padding: 10px;
        }
    </style>

    <h1>Product List with Add to Cart Counter</h1>
    <h2>Cart Items: <span id="cartCount">0</span></h2>

    <div>
        <div class="container">
            <p><strong>Laptop</strong></p>
            <button class="addBtn btn btn-primary">Add to Cart</button>
            <span class="msg"></span>
        </div>

        <div class="container">
            <p><strong>Computer</strong></p>
            <button class="addBtn btn btn-primary">Add to Cart</button>
            <span class="msg"></span>
        </div>

        <div class="container">
            <p><strong>Mobile</strong></p>
            <button class="addBtn btn btn-primary">Add to Cart</button>
            <span class="msg"></span>
        </div>

        <div class="container">
            <p><strong>Tab</strong></p>
            <button class="addBtn btn btn-primary">Add to Cart</button>
            <span class="msg"></span>
        </div>
    </div>

    <script>

        let count = 0;

        $(".addBtn").click(function() {

            count++;

            $("#cartCount").text(count); 

            $(this).prop("disabled", true); 

            $(this).text("Added"); 

            $(this).next(".msg").html("<b>Added to Cart<b>");
        });

    </script>

</body>
</html>
