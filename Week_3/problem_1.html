<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form Interaction</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <h1>Student Feedback Form Interaction</h1>

    <form action="#">
        <label>Name</label>
        <input type="text" id="name"/>
        <br/><br/>

        <label>Email</label>
        <input type="email" id="email"/>
        <br/><br/>

        <label>Course Rating:</label>
        <select id="rating">
            <option selected>Select Rating</option>
            <option>Excellent</option>
            <option>Very Good</option>
            <option>Good</option>
            <option>Average</option>
            <option>Bad</option>
        </select>
        <br/><br/>

        <textarea id="comments" rows="4"></textarea>
        <br><br>

        <button type="button" id="submit">Submit</button>
        <br/>
        <p id="para"></p>
    </form>

    <script>
        $(document).ready(function () {

            $("#submit").click(function() {

                let name = $("#name").val();
                let email = $("#email").val();

                if (name === "" || email === "") {
                    $("#para").text("Please enter Correct Name and Email.");
                } 
                else {
                    $("#para").text("Feedback has been submitted successfully.");

                    $("#name").val("");
                    $("#email").val("");
                    $("#comments").val("");
                }
            });

        });
    </script>

</body>
</html>
